[package]
name = "cabletidy"
version = "0.4.0-rc.3"
edition = "2021"
rust-version = "1.95"
description = "A local multi-target coding CLI gateway and provider manager."
license = "MIT"
repository = "https://github.com/ZY-WANG-0304/cabletidy"

[features]
test-support = []

[[bin]]
name = "cabletidy-test-daemon"
path = "test/support/daemon.rs"
required-features = ["test-support"]

[[bin]]
name = "cabletidy-test-bridge"
path = "test/support/bridge.rs"
required-features = ["test-support"]

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
futures-util = "0.3"
hostname = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "stream", "json", "gzip", "brotli", "deflate"] }
regex = "1"
ring = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
toml_edit = { version = "0.22", features = ["serde"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security_Authorization"] }

[profile.release]
lto = "thin"
strip = true
