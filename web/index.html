<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c1715" />
    <title>CableTidy Control Room</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="rail">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>
            <strong>CableTidy</strong>
            <small>CONTROL ROOM</small>
          </span>
        </div>
        <div class="rail-status">
          <span class="status-light"></span>
          <span id="rail-status">连接中</span>
        </div>
        <nav class="nav" aria-label="主导航">
          <button class="nav-item is-active" data-page="overview">
            <span class="nav-index">01</span><span>配置套装</span>
          </button>
          <button class="nav-item" data-page="diagnostics">
            <span class="nav-index">02</span><span>诊断</span>
          </button>
        </nav>
        <div class="rail-footer">
          <span>LOCAL ONLY</span>
          <span id="revision-label">REV 0</span>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="page-eyebrow">SYSTEM / OVERVIEW</p>
            <h1 id="page-title">让每个 CLI 都走自己的线</h1>
          </div>
          <div class="topbar-actions">
            <button class="button button-quiet" id="refresh-button">刷新状态</button>
            <button class="button button-primary" id="save-button">保存变更</button>
          </div>
        </header>
        <div id="toast-region" class="toast-region" aria-live="polite"></div>
        <section id="page-content" class="page-content"></section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
