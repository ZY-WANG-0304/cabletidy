<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f7" />
    <title>CableTidy 管理</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="rail">
        <div class="brand">
          <strong>CableTidy</strong>
        </div>
        <div class="rail-status">
          <span class="status-light" aria-hidden="true"></span>
          <span id="rail-status">连接中</span>
        </div>
        <nav class="nav" aria-label="主导航">
          <button class="nav-item is-active" data-page="overview">
            配置套装
          </button>
          <button class="nav-item" data-page="diagnostics">
            诊断
          </button>
        </nav>
        <div class="rail-footer">
          <span id="revision-label">版本 0</span>
        </div>
      </aside>

      <main class="main" id="main-content">
        <header class="topbar">
          <div>
            <h1 id="page-title">配置套装</h1>
          </div>
          <div class="topbar-actions">
            <button class="button button-quiet" id="refresh-button">刷新</button>
          </div>
        </header>
        <div id="toast-region" class="toast-region" aria-live="polite"></div>
        <section id="page-content" class="page-content"></section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
